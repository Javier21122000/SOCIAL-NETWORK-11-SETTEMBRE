spring.application.name=SOCIAL-NETWORK-11-SETTEMBRE
# Server
server.port=8080
# Connessione Database
spring.datasource.url=jdbc:postgresql://localhost:5432/SOCIAL-NETWORK-11-SETTEMBRE
spring.datasource.username=javiertorresruiz
spring.datasource.password=psw1234java
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# La sessione resta aperta durante la serializzazione delle collezioni foto/documenti.
spring.jpa.open-in-view=true
# Limiti Upload File (Foto e Documenti)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1MB
app.upload-dir=uploads
